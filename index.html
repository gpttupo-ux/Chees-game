<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Класичні шахи в браузері: гра проти комп'ютера або вдвох на одному екрані.">
  <title>Шахи — класична гра</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23171c22'/%3E%3Ctext x='32' y='47' font-size='42' text-anchor='middle' fill='%23e0b872'%3E%E2%99%9A%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1>Шахи</h1>
      <span class="badge">класичні правила</span>
    </header>

    <main>
      <section class="board-column">
        <div class="player-strip" id="topStrip">
          <span class="avatar b" id="topAvatar">♚</span>
          <span class="name" id="topName">Комп'ютер</span>
          <span class="captured" id="topCaptured"></span>
        </div>

        <div class="board-wrap">
          <div class="board" id="board" aria-label="Шахова дошка"></div>

          <div class="overlay" id="gameOver">
            <div class="overlay-card">
              <h2 id="overTitle">Гру завершено</h2>
              <p id="overText"></p>
              <div class="overlay-actions">
                <button type="button" class="btn primary" id="overNew">Нова партія</button>
                <button type="button" class="btn" id="overClose">Закрити</button>
              </div>
            </div>
          </div>

          <div class="overlay" id="promoOverlay">
            <div class="overlay-card">
              <h2>Оберіть фігуру</h2>
              <p>Пішак досяг останньої лінії</p>
              <div class="promo-options" id="promoOptions"></div>
            </div>
          </div>
        </div>

        <div class="player-strip" id="bottomStrip">
          <span class="avatar w" id="bottomAvatar">♚</span>
          <span class="name" id="bottomName">Ви</span>
          <span class="captured" id="bottomCaptured"></span>
        </div>
      </section>

      <aside class="sidebar">
        <div class="card status-card">
          <div class="status-row">
            <span class="turn-dot" id="turnDot"></span>
            <span class="status-text" id="statusText">Хід білих</span>
          </div>
          <div class="status-sub" id="statusSub">Ваш хід</div>
        </div>

        <div class="card">
          <div class="seg" id="modeSeg">
            <button type="button" data-mode="ai" class="active">Проти комп'ютера</button>
            <button type="button" data-mode="pvp">Два гравці</button>
          </div>

          <label class="field">
            <span>Складність</span>
            <select id="difficulty">
              <option value="1">Легка</option>
              <option value="2" selected>Середня</option>
              <option value="3">Складна</option>
            </select>
          </label>

          <div class="btn-grid">
            <button type="button" class="btn primary" id="btnNew">Нова партія</button>
            <button type="button" class="btn" id="btnUndo">Скасувати хід</button>
            <button type="button" class="btn" id="btnFlip">Перевернути</button>
            <button type="button" class="btn" id="btnSound">🔊 Звук</button>
          </div>
        </div>

        <div class="card moves-card">
          <div class="moves-head">
            <span>Ходи</span>
            <button type="button" class="btn tiny" id="btnPgn">PGN</button>
          </div>
          <div class="moves-body" id="moveList"></div>
        </div>
      </aside>
    </main>

    <footer class="hint">Клікніть фігуру, а потім поле, щоб зробити хід. Крапки показують доступні ходи.</footer>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/engine.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
